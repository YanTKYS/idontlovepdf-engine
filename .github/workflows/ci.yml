name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests (Node)
        run: npm test

      - name: Install Playwright's Chromium (used by the browser bundle smoke test)
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke test
        run: npm run test:browser

      - name: Type/syntax check
        run: npm run check

      - name: Build the browser bundle
        run: npm run build

      - name: Verify the bundle was produced
        run: test -s dist/idontlovepdf-engine.js
