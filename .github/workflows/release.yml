name: Release

# Builds dist/idontlovepdf-engine.js and attaches it to a GitHub Release whenever a
# `v*` tag is pushed, so a specific engine version's bundle can always be fetched
# again later (see "distの管理方針" / "Distribution policy" in README.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright's Chromium (used by the browser bundle smoke test)
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      - name: Build the browser bundle
        run: npm run build

      - name: Verify the bundle was produced
        run: test -s dist/idontlovepdf-engine.js

      - name: Checksum the bundle
        run: sha256sum dist/idontlovepdf-engine.js | awk '{print $1}' > dist/idontlovepdf-engine.js.sha256

      - name: Publish the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/idontlovepdf-engine.js
            dist/idontlovepdf-engine.js.sha256
          generate_release_notes: true
