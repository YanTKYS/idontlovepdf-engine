name: Diagnose real PDF font metrics

# Manual-only. This fetches an arbitrary external PDF into a GitHub-hosted
# runner and is intentionally kept separate from the regular push/PR CI in
# ci.yml, so fetching an arbitrary real-PDF URL is never triggered
# automatically by a push or PR.
#
# Beyond diagnosis, this also runs an actual edit (search -> fallback font ->
# check -> replace -> save -> reopen -> search again) against the fetched PDF
# when `run_edit_test` is true, and verifies the result with tools that share
# no code with this engine (pdfminer.six, qpdf, Chromium). It also checks
# (v0.4.4) that `unsafe_replacement` -- wide enough, in the fallback font, to
# overrun the text after the match -- is REFUSED before anything is written,
# and that the document is byte-for-byte unchanged afterwards. The PDF itself is
# never committed, uploaded as a workflow artifact, cached, or otherwise kept
# past the job -- everything happens on the runner's own ephemeral disk, and
# this workflow adds no network access to the engine's runtime, only to this
# development-time job.
on:
  workflow_dispatch:
    inputs:
      pdf_url:
        description: "PDF URL to fetch and diagnose"
        required: true
        default: "https://www.city.itoman.lg.jp/uploaded/attachment/22550.pdf"
      text:
        description: "Text to search for"
        required: true
        default: "令和"
      font:
        description: "Font resource name (without the leading /)"
        required: true
        default: "F3"
      run_edit_test:
        description: "Also run the search -> fallback -> replace -> save -> reopen edit smoke test, and verify the result with pdfminer.six/qpdf/Chromium"
        type: boolean
        required: true
        default: false
      fallback_replacement:
        description: "Replacement text that needs the fallback font (edit test only)"
        required: true
        default: "しょ"
      regression_replacement:
        description: "Replacement text expected to work through the document's own font, as a regression check (edit test only)"
        required: true
        default: "平成"
      unsafe_replacement:
        description: "Replacement text expected to be REFUSED (v0.4.4): wider, via the fallback font, than the text it would replace, so it would overrun the following text -- must not be written (edit test only)"
        required: true
        default: "しょうわ"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch the target PDF
        env:
          PDF_URL: ${{ inputs.pdf_url }}
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/input.pdf"
          status=$(curl --silent --show-error --location --retry 2 \
            --output "$dest" --write-out '%{http_code}' "$PDF_URL")
          echo "HTTP status: $status"
          echo "URL: $PDF_URL"
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::Could not fetch the PDF from this GitHub-hosted runner. URL: $PDF_URL, HTTP status: $status"
            exit 1
          fi
          echo "PDF_PATH=$dest" >> "$GITHUB_ENV"

      - name: Verify the download is actually a PDF
        run: |
          set -euo pipefail
          if [ ! -s "$PDF_PATH" ]; then
            echo "::error::Downloaded file is missing or empty: $PDF_PATH"
            exit 1
          fi
          header=$(head -c 5 "$PDF_PATH")
          if [ "$header" != "%PDF-" ]; then
            echo "::error::Downloaded file does not start with %PDF- (got: $header). This is likely an HTML error page, not a PDF."
            exit 1
          fi
          echo "Downloaded $(wc -c < "$PDF_PATH") bytes, header looks like a PDF."

      - name: Run font metrics diagnosis
        env:
          DIAG_TEXT: ${{ inputs.text }}
          DIAG_FONT: ${{ inputs.font }}
        run: |
          set -euo pipefail
          node scripts/diagnose-font-metrics.js "$PDF_PATH" --font "$DIAG_FONT" --text "$DIAG_TEXT"

      # Everything below only runs when run_edit_test is checked. It is the actual
      # Go/No-Go check: not just "can this font be diagnosed" but "can this document be
      # edited, saved, reopened, and read back -- through the public API a real caller
      # uses, and confirmed by tools this engine shares no code with".
      - name: Fetch the fallback-font tests' font
        if: ${{ inputs.run_edit_test }}
        run: npm run test:font

      - name: Run the edit smoke test (search -> fallback -> check -> replace -> save -> reopen -> search)
        if: ${{ inputs.run_edit_test }}
        env:
          DIAG_TEXT: ${{ inputs.text }}
          FALLBACK_TEXT: ${{ inputs.fallback_replacement }}
          REGRESSION_TEXT: ${{ inputs.regression_replacement }}
          UNSAFE_TEXT: ${{ inputs.unsafe_replacement }}
        run: |
          set -euo pipefail
          edited="$RUNNER_TEMP/edited.pdf"
          echo "EDITED_PDF_PATH=$edited" >> "$GITHUB_ENV"
          node scripts/verify-real-pdf-edit.js "$PDF_PATH" \
            --font tmp/test-fonts/BIZUDGothic-Regular.ttf \
            --search "$DIAG_TEXT" --fallback "$FALLBACK_TEXT" --regression "$REGRESSION_TEXT" \
            --unsafe "$UNSAFE_TEXT" \
            --out "$edited"

      # An independent reader (pdfminer.six shares no code with src/) confirms the text
      # drawn after the match was not moved by the TJ adjustment the engine wrote --
      # not the engine re-checking its own arithmetic. Installed into a venv rather than
      # the runner's system Python to avoid colliding with its preinstalled packages.
      - name: Verify text position with pdfminer.six (independent of this engine)
        if: ${{ inputs.run_edit_test }}
        env:
          DIAG_TEXT: ${{ inputs.text }}
          FALLBACK_TEXT: ${{ inputs.fallback_replacement }}
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/pdfminer-venv"
          "$RUNNER_TEMP/pdfminer-venv/bin/pip" install --quiet pdfminer.six
          "$RUNNER_TEMP/pdfminer-venv/bin/python3" scripts/verify-real-pdf-position.py \
            --before "$PDF_PATH" --after "$EDITED_PDF_PATH" \
            --marker-before "$DIAG_TEXT" --marker-after "$FALLBACK_TEXT"

      # qpdf --check exits 0 (clean), 2 (warnings only -- e.g. a quirk already present in
      # the original file, or one incremental updates commonly trigger, neither of which
      # means the file is broken), or 3+ (actual structural errors). Only 3+ fails this
      # step; a real government PDF is not held to a stricter standard than qpdf itself
      # applies, but a genuine structural error in either file must not be waved through.
      - name: Verify structural integrity with qpdf (independent of this engine)
        if: ${{ inputs.run_edit_test }}
        run: |
          set -uo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y qpdf

          check_one() {
            local label="$1" path="$2" code
            echo "--- qpdf --check ($label) ---"
            qpdf --check "$path"
            code=$?
            echo "qpdf --check ($label) exit code: $code"
            if [ "$code" -ge 3 ]; then
              echo "::error::qpdf reported structural errors in $label ($path)"
              return 1
            fi
            if [ "$code" -eq 2 ]; then
              echo "::warning::qpdf reported warnings (not structural errors) in $label ($path)"
            fi
            return 0
          }

          status=0
          check_one "original" "$PDF_PATH" || status=1
          check_one "edited" "$EDITED_PDF_PATH" || status=1
          exit "$status"

      - name: Verify the edited PDF opens in Chromium's own PDF viewer (independent of this engine)
        if: ${{ inputs.run_edit_test }}
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium
          node scripts/verify-real-pdf-viewer.js "$EDITED_PDF_PATH"

      # The PDF itself is never uploaded, cached, or committed -- only ever written to
      # $RUNNER_TEMP, which is discarded with the runner at the end of the job.
